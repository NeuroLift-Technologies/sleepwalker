[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sleepwalker-protocol"
version = "1.0.1"
description = "PROTOTYPE / not medical advice — Emotional Continuity Governance for AI Systems. Python port of @neurolift-technologies/sleepwalker-protocol."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "NeuroLift Technologies / HAIEF", email = "haief@neuroliftsolutions.com" },
]
keywords = [
    "ai",
    "emotional-safety",
    "mental-health",
    "neurodivergent",
    "ai-ethics",
    "trauma-informed",
    "prototype",
    "experimental",
    "not-medical-advice",
    "solidarity-framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/NeuroLift-Technologies/sleepwalker"
Repository = "https://github.com/NeuroLift-Technologies/sleepwalker"
Issues = "https://github.com/NeuroLift-Technologies/sleepwalker/issues"

# --- Build backend (Hatchling) -------------------------------------------------
# src/ layout: the importable package is src/sleepwalker_protocol, published as
# ``sleepwalker_protocol`` under the distribution name ``sleepwalker-protocol``
# (the bare name "sleepwalker" is taken on PyPI).
[tool.hatch.build.targets.wheel]
packages = ["src/sleepwalker_protocol"]

# Lean sdist: only what the Python package and its conformance suite need. The
# repo's ``src/`` and ``tests/`` directories are shared with the upstream
# TypeScript package (the ``@neurolift-technologies/sleepwalker-protocol`` npm
# source of truth), so scope the sdist to the Python package and the ported
# pytest suites — the ``*.ts`` source and ``*.test.ts`` files are excluded.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/sleepwalker_protocol",
    "tests/test_consent.py",
    "tests/test_continuity.py",
    "tests/test_protocol.py",
    "tests/test_state_detection.py",
    "tests/test_toi_loader.py",
    "README.md",
    "LICENSE",
]

# --- Test config ---------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
